version: "3.9"

services:
  pluse-rag:
    build: .
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      - ./faiss_index_tra_chi:/app/faiss_index_tra_chi:ro
      - ./faiss_index_sim_chi:/app/faiss_index_sim_chi:ro
      - ./faiss_index_en:/app/faiss_index_en:ro
      - ./logs:/app/logs
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
