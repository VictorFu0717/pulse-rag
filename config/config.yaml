# ─────────────────────────────────────────────────────────────────────────────
#  Pluse RAG  —  config/config.yaml
#
#  This is the single file you need to edit to customise the system.
#  Replace the example values with your own company's settings.
# ─────────────────────────────────────────────────────────────────────────────

app:
  name: "AcmeTech AI Assistant"   # ← change to your app name
  host: "0.0.0.0"
  port: 8002
  cors_origins: ["*"]

# ── LLM ──────────────────────────────────────────────────────────────────────
# provider: ollama | openai | custom
llm:
  provider: "ollama"
  model: "qwen3.5:latest"
  base_url: "http://localhost:11434"
  temperature: 0

# Switch to OpenAI:
# llm:
#   provider: "openai"
#   model: "gpt-4o-mini"

# Any OpenAI-compatible endpoint (vLLM, LM Studio, Ollama, etc.):
# llm:
#   provider: "custom"
#   model: "my-model"
#   base_url: "http://localhost:8317/v1"
#   api_key: "your-key"

# ── Embeddings ────────────────────────────────────────────────────────────────
embeddings:
  model: "BAAI/bge-m3"   # multilingual; change to any HuggingFace sentence-transformer
  device: "auto"          # auto | cpu | cuda

# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  faiss_k: 8              # candidates fetched from FAISS before reranking
  rerank_top_k: 3         # documents kept after reranking

# ── Reranker ──────────────────────────────────────────────────────────────────
reranker:
  model: "BAAI/bge-reranker-v2-minicpm-layerwise"
  cutoff_layers: [28]     # 8–40; lower = faster, slightly less accurate
  use_fp16: true
  batch_size: 16

# ── Knowledge Bases ───────────────────────────────────────────────────────────
# Each entry creates one retrieval tool for the agent.
# - data_dir   : folder with your .txt FAQ files (used by build_index.py)
# - index_path : where the FAISS index is saved / loaded
# - url_prefix : (optional) prepended to file paths to generate source links
#
# Add more entries to support additional languages or domains.
knowledge_bases:
  - name: "english"
    data_dir: "data/example_faq/en"
    index_path: "faiss_index_en"
    url_prefix: "https://help.acmetech.example.com/en"   # ← change or remove
    tool_name: "retrieve_en"
    tool_description: >
      Search the English knowledge base for customer questions about
      products, pricing, billing, account management, and technical support.

  - name: "traditional_chinese"
    data_dir: "data/example_faq/zh-TW"
    index_path: "faiss_index_zh_tw"
    url_prefix: "https://help.acmetech.example.com/zh-TW"   # ← change or remove
    tool_name: "retrieve_zh_tw"
    tool_description: >
      搜尋繁體中文知識庫，回答客戶關於產品、定價、帳單、帳戶管理與技術支援的問題。

# ── Plugins ───────────────────────────────────────────────────────────────────
# All files in plugins/ are loaded automatically.
# To disable a plugin, add its filename (without .py) to the list below.
tools:
  disabled_plugins: ["domain_checker"]  # e.g. ["web_search", "domain_checker"]

# ── Memory ────────────────────────────────────────────────────────────────────
memory:
  max_messages: 10    # sliding window; trims oldest messages first

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  dir: "logs"
  retention_days: 7

# ── System Prompt ─────────────────────────────────────────────────────────────
system_prompt_path: "config/system_prompt.txt"
