categories:
  register:
    group: domain
    label: register
    description: "申請域名/續用域名/免登入續用/域名到期通知續用/代理人服務, 如何申請域名, 域名申請規則"

  transfer:
    group: domain
    label: transfer
    description: "移轉與讓渡/將域名轉入網路中文/辦理域名讓渡/變更域名管理帳戶"

  updateinfo:
    group: domain
    label: updateinfo
    description: "資料修改/修改域名註冊資料/修改域名共用聯絡人資料, 會員信箱與域名信箱的區別; 資料修改流程"

  VAS:
    group: domain
    label: VAS
    description: "加值服務/購買加值服務/設定轉址/設定shopline轉址和cname/如何啟用／停用域名鎖/如何設定WHOIS隱私?"

  account:
    group: membership
    label: account
    description: "帳號管理/創建會員帳號/修改會員信箱/如何將域名歸戶?/我無法登入(忘記帳號密碼)/變更會員密碼/修改會員資料/二階段驗證"

  payment:
    group: order
    label: payment
    description: "訂單管理/確認訂單狀態/如何使用折價券?/繳費方式與匯款資料/如何儲值預付款/尚未收到發票/修改發票資料/電子發票常見問題"

  cloud:
    group: tech
    label: cloud
    description: "雲端服務/Plesk生成CSR文件/安裝SSL憑證/開通企業信箱/EZ Mail郵件設定/EZ Mail開通設定與操作說明"

  DNS:
    group: tech
    label: DNS
    description: "DNS設置/DNS紀錄設定/DNS主機設定/A/AAAA紀錄設定/CNAME紀錄設定/MX紀錄設定/TXT紀錄設定/SPF/DKIM/DMARC/SRV/DNSSEC"

  ssl:
    group: tech
    label: ssl
    description: "SSL憑證/SSL遞交資料流程/SSL憑證驗證流程/SSL更新憑證/SSL續用憑證/CSR文件相關問題/SSL私鑰"

  else:
    group: else
    label: "Past Issues Record / Definition of proper nouns"
    description: "「需連結智慧卡」的訊息/DNS萬用字元與特殊符號/網域要轉出/產生CSR檔未看見私鑰/SSL/註冊人相關資料變更"

