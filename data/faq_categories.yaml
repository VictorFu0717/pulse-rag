# ─────────────────────────────────────────────────────────────────────────────
#  data/faq_categories.yaml
#
#  Optional metadata for FAQ categories used during index building.
#  Maps the folder name inside your data_dir to a group, label, and description.
#
#  If a folder name is NOT listed here, it will be indexed with the folder name
#  used directly as the label — so this file is optional but recommended.
# ─────────────────────────────────────────────────────────────────────────────

categories:
  products:
    group: products
    label: Products & Pricing
    description: "Service catalog, pricing plans, features, and plan comparison"

  billing:
    group: billing
    label: Billing & Payments
    description: "Payment methods, invoices, subscriptions, upgrades, and refunds"

  support:
    group: support
    label: Technical Support
    description: "Getting started, troubleshooting, error codes, and integrations"

  account:
    group: account
    label: Account Management
    description: "Registration, login, password reset, two-factor authentication, and profile settings"

# ─────────────────────────────────────────────────────────────────────────────
