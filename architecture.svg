<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="boxPurple" x1="0" x2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="boxOrange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="boxGray" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>

    <style>
      .title { font: 700 30px 'Arial', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 14px 'Arial', sans-serif; fill: #475569; }
      .box-title { font: 700 18px 'Arial', sans-serif; fill: #0f172a; }
      .box-text { font: 500 14px 'Arial', sans-serif; fill: #1e293b; }
      .small { font: 500 12px 'Arial', sans-serif; fill: #334155; }
      .section-title { font: 700 20px 'Arial', sans-serif; fill: #1e293b; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .panel { fill: white; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .box { stroke: #94a3b8; stroke-width: 1.4; rx: 16; filter: url(#shadow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>

  <text x="800" y="50" text-anchor="middle" class="title">RAG 智慧客服系統整體架構圖</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">API / Agent / Retrieval / Reranker / Vector Store / External Services</text>

  <!-- Left Panel -->
  <rect x="40" y="110" width="300" height="780" class="panel"/>
  <text x="190" y="145" text-anchor="middle" class="section-title">用戶與入口層</text>

  <rect x="75" y="180" width="230" height="90" fill="url(#boxGray)" class="box"/>
  <text x="190" y="215" text-anchor="middle" class="box-title">Client / Frontend</text>
  <text x="190" y="240" text-anchor="middle" class="box-text">Web / App / Demo Page</text>

  <rect x="75" y="320" width="230" height="130" fill="url(#boxBlue)" class="box"/>
  <text x="190" y="355" text-anchor="middle" class="box-title">FastAPI Service</text>
  <text x="190" y="382" text-anchor="middle" class="box-text">/query</text>
  <text x="190" y="405" text-anchor="middle" class="box-text">/query-stream</text>
  <text x="190" y="428" text-anchor="middle" class="small">CORS / Request Handling / Streaming</text>

  <rect x="75" y="500" width="230" height="120" fill="url(#boxGray)" class="box"/>
  <text x="190" y="535" text-anchor="middle" class="box-title">Logging</text>
  <text x="190" y="562" text-anchor="middle" class="box-text">Request / Response</text>
  <text x="190" y="585" text-anchor="middle" class="box-text">Timed Rotating Logs</text>

  <rect x="75" y="670" width="230" height="140" fill="url(#boxGray)" class="box"/>
  <text x="190" y="705" text-anchor="middle" class="box-title">Environment / Config</text>
  <text x="190" y="732" text-anchor="middle" class="box-text">.env / API Keys</text>
  <text x="190" y="755" text-anchor="middle" class="box-text">Runtime Settings</text>
  <text x="190" y="778" text-anchor="middle" class="small">OpenAI / Tavily / WhoisJSON</text>

  <!-- Middle Panel -->
  <rect x="390" y="110" width="500" height="780" class="panel"/>
  <text x="640" y="145" text-anchor="middle" class="section-title">核心協調層</text>

  <rect x="440" y="180" width="400" height="120" fill="url(#boxPurple)" class="box"/>
  <text x="640" y="215" text-anchor="middle" class="box-title">Agent / Orchestration</text>
  <text x="640" y="242" text-anchor="middle" class="box-text">LangChain Agent + LangGraph</text>
  <text x="640" y="265" text-anchor="middle" class="box-text">依問題判斷工具使用路徑</text>

  <rect x="440" y="340" width="400" height="110" fill="url(#boxPurple)" class="box"/>
  <text x="640" y="375" text-anchor="middle" class="box-title">Conversation Memory</text>
  <text x="640" y="402" text-anchor="middle" class="box-text">Thread-based Checkpoint</text>
  <text x="640" y="425" text-anchor="middle" class="small">保留多輪對話上下文</text>

  <rect x="440" y="490" width="400" height="110" fill="url(#boxPurple)" class="box"/>
  <text x="640" y="525" text-anchor="middle" class="box-title">Message Middleware</text>
  <text x="640" y="552" text-anchor="middle" class="box-text">Trim Messages / Context Control</text>
  <text x="640" y="575" text-anchor="middle" class="small">控制上下文長度與訊息完整性</text>

  <rect x="440" y="640" width="400" height="160" fill="url(#boxOrange)" class="box"/>
  <text x="640" y="675" text-anchor="middle" class="box-title">LLM 回答生成</text>
  <text x="640" y="702" text-anchor="middle" class="box-text">依檢索結果生成最終回覆</text>
  <text x="640" y="725" text-anchor="middle" class="box-text">支援一般回應 / 串流回應</text>
  <text x="640" y="748" text-anchor="middle" class="small">嚴格依工具結果回答，不做業務推測</text>

  <!-- Right Top Panel -->
  <rect x="940" y="110" width="620" height="380" class="panel"/>
  <text x="1250" y="145" text-anchor="middle" class="section-title">檢索與工具層</text>

  <rect x="980" y="185" width="170" height="95" fill="url(#boxGreen)" class="box"/>
  <text x="1065" y="220" text-anchor="middle" class="box-title">繁中檢索</text>
  <text x="1065" y="245" text-anchor="middle" class="box-text">retrieve_tra_chi</text>

  <rect x="1170" y="185" width="170" height="95" fill="url(#boxGreen)" class="box"/>
  <text x="1255" y="220" text-anchor="middle" class="box-title">簡中檢索</text>
  <text x="1255" y="245" text-anchor="middle" class="box-text">retrieve_sim_chi</text>

  <rect x="1360" y="185" width="170" height="95" fill="url(#boxGreen)" class="box"/>
  <text x="1445" y="220" text-anchor="middle" class="box-title">英文檢索</text>
  <text x="1445" y="245" text-anchor="middle" class="box-text">retrieve_en</text>

  <rect x="980" y="320" width="260" height="110" fill="url(#boxOrange)" class="box"/>
  <text x="1110" y="355" text-anchor="middle" class="box-title">網路搜尋工具</text>
  <text x="1110" y="382" text-anchor="middle" class="box-text">外部搜尋 / 即時資訊補充</text>
  <text x="1110" y="405" text-anchor="middle" class="small">用於上網查詢情境</text>

  <rect x="1270" y="320" width="260" height="110" fill="url(#boxOrange)" class="box"/>
  <text x="1400" y="355" text-anchor="middle" class="box-title">Domain 查詢工具</text>
  <text x="1400" y="382" text-anchor="middle" class="box-text">單筆 / 批次可註冊查詢</text>
  <text x="1400" y="405" text-anchor="middle" class="small">Whois API + Local Fallback</text>

  <!-- Right Bottom Panel -->
  <rect x="940" y="530" width="620" height="360" class="panel"/>
  <text x="1250" y="565" text-anchor="middle" class="section-title">知識與資料層</text>

  <rect x="980" y="605" width="170" height="95" fill="url(#boxBlue)" class="box"/>
  <text x="1065" y="640" text-anchor="middle" class="box-title">FAISS Index</text>
  <text x="1065" y="665" text-anchor="middle" class="box-text">Traditional Chinese</text>

  <rect x="1170" y="605" width="170" height="95" fill="url(#boxBlue)" class="box"/>
  <text x="1255" y="640" text-anchor="middle" class="box-title">FAISS Index</text>
  <text x="1255" y="665" text-anchor="middle" class="box-text">Simplified Chinese</text>

  <rect x="1360" y="605" width="170" height="95" fill="url(#boxBlue)" class="box"/>
  <text x="1445" y="640" text-anchor="middle" class="box-title">FAISS Index</text>
  <text x="1445" y="665" text-anchor="middle" class="box-text">English</text>

  <rect x="980" y="735" width="260" height="105" fill="url(#boxPurple)" class="box"/>
  <text x="1110" y="770" text-anchor="middle" class="box-title">Embedding Model</text>
  <text x="1110" y="797" text-anchor="middle" class="box-text">BGE-M3</text>
  <text x="1110" y="820" text-anchor="middle" class="small">Query / Document 向量化</text>

  <rect x="1270" y="735" width="260" height="105" fill="url(#boxPurple)" class="box"/>
  <text x="1400" y="770" text-anchor="middle" class="box-title">Reranker</text>
  <text x="1400" y="797" text-anchor="middle" class="box-text">BGE Reranker</text>
  <text x="1400" y="820" text-anchor="middle" class="small">候選文件重排序</text>

  <!-- Bottom source area -->
  <rect x="390" y="910" width="1170" height="45" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="975" y="938" text-anchor="middle" class="small">
    資料來源：FAQ 文件、多語系知識資料、服務頁面內容、外部搜尋結果、Domain Whois 查詢
  </text>

  <!-- Connections -->
  <path d="M305 225 L390 225 L390 240 L440 240" class="line"/>
  <path d="M305 385 L390 385 L390 240 L440 240" class="line"/>
  <path d="M640 300 L640 340" class="line"/>
  <path d="M640 450 L640 490" class="line"/>
  <path d="M640 600 L640 640" class="line"/>

  <path d="M840 240 L980 232" class="line"/>
  <path d="M840 240 L1170 232" class="line"/>
  <path d="M840 240 L1360 232" class="line"/>
  <path d="M840 240 L980 375" class="line"/>
  <path d="M840 240 L1270 375" class="line"/>

  <path d="M1065 280 L1065 605" class="line dashed"/>
  <path d="M1255 280 L1255 605" class="line dashed"/>
  <path d="M1445 280 L1445 605" class="line dashed"/>

  <path d="M1110 735 L1110 700 L1065 700" class="line"/>
  <path d="M1110 735 L1110 700 L1255 700" class="line"/>
  <path d="M1110 735 L1110 700 L1445 700" class="line"/>

  <path d="M1400 735 L1400 700 L1065 700" class="line"/>
  <path d="M1400 735 L1400 700 L1255 700" class="line"/>
  <path d="M1400 735 L1400 700 L1445 700" class="line"/>

  <path d="M1530 375 L1560 375 L1560 860 L1490 860" class="line dashed"/>
  <text x="1515" y="850" text-anchor="end" class="small">External Services</text>

  <path d="M640 800 L640 860 L305 860 L305 560" class="line dashed"/>
  <path d="M640 800 L640 860 L305 860 L305 740" class="line dashed"/>
</svg>