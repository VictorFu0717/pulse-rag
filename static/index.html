<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse RAG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .row.user  { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .row.user     .avatar { background: #1a1a2e; }
    .row.assistant .avatar { background: #6c757d; }

    .bubble {
      max-width: min(72%, 640px);
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.user      .bubble { background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
    .row.assistant .bubble { background: #fff;     color: #1a1a2e; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    .thinking { color: #aaa; font-style: italic; }

    #footer {
      border-top: 1px solid #dde1e7;
      background: #fff;
      padding: 12px 16px;
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    #input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #dde1e7;
      border-radius: 24px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.4;
      max-height: 140px;
      overflow-y: auto;
    }
    #input:focus { border-color: #1a1a2e; }

    #send {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 0 22px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      height: 46px;
      white-space: nowrap;
      transition: background .15s;
    }
    #send:hover    { background: #16213e; }
    #send:disabled { background: #b0b8c1; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>Pulse RAG</header>
  <div id="chat"></div>
  <div id="footer">
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="Ask something…"></textarea>
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const chat    = document.getElementById('chat');
    const input   = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const threadId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);

    // Auto-grow textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    function addBubble(role, text) {
      const initials = role === 'user' ? 'U' : 'AI';
      const row = document.createElement('div');
      row.className = `row ${role}`;
      row.innerHTML = `<div class="avatar">${initials}</div><div class="bubble"></div>`;
      const bubble = row.querySelector('.bubble');
      bubble.textContent = text;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      addBubble('user', text);

      const bubble = addBubble('assistant', 'Thinking…');
      bubble.classList.add('thinking');
      let started = false;

      try {
        const res = await fetch('/query-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text, thread_id: threadId }),
        });

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6).trim();
            if (payload === '[DONE]') break;
            try {
              const { token, error } = JSON.parse(payload);
              if (error) {
                bubble.textContent = error;
                bubble.classList.remove('thinking');
                started = true;
              } else if (token) {
                if (!started) {
                  bubble.textContent = '';
                  bubble.classList.remove('thinking');
                  started = true;
                }
                bubble.textContent += token;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch { /* malformed chunk, skip */ }
          }
        }
      } catch {
        bubble.textContent = 'Connection error — is the server running?';
        bubble.classList.remove('thinking');
        started = true;
      }

      if (!started) {
        bubble.textContent = '(no response)';
        bubble.classList.remove('thinking');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
